<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de fluxo de caixa: Confecção da Dona Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF2F8; --surface: #FFFFFF; --surface-2: #F5F8FC; --ink: #12263F; --muted: #55677C;
  --line: #D3DEEA; --primary: #0A6FC2; --on-primary: #FFFFFF;
  --pos: #137A4B; --pos-bg: #DCF2E7; --neg: #BE352E; --neg-bg: #FBE2E0;
  --mix: #8A5A00; --mix-bg: #FFF0C7; --neu: #4A5B70; --neu-bg: #E4EAF1;
  --chg: #FFE9A6; --ghost: #7D8DA1; --shadow: 0 1px 2px rgba(18,38,63,.06), 0 6px 20px rgba(18,38,63,.06);
  --radius: 14px;
  --f-head: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1827; --surface: #152538; --surface-2: #1B2F46; --ink: #E7EFF8; --muted: #9FB2C7;
    --line: #2B4057; --primary: #55A8EE; --on-primary: #08203A;
    --pos: #52C98F; --pos-bg: #133A29; --neg: #FF918A; --neg-bg: #4A2422;
    --mix: #F3C65B; --mix-bg: #43360F; --neu: #B4C4D6; --neu-bg: #263A50;
    --chg: #5C4A10; --ghost: #8FA3B8; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1827; --surface: #152538; --surface-2: #1B2F46; --ink: #E7EFF8; --muted: #9FB2C7;
  --line: #2B4057; --primary: #55A8EE; --on-primary: #08203A;
  --pos: #52C98F; --pos-bg: #133A29; --neg: #FF918A; --neg-bg: #4A2422;
  --mix: #F3C65B; --mix-bg: #43360F; --neu: #B4C4D6; --neu-bg: #263A50;
  --chg: #5C4A10; --ghost: #8FA3B8; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 40px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.top h1 { font-size: clamp(1.5rem, 4.5vw, 2.1rem); font-weight: 800; }
.top .sub { color: var(--muted); font-size: .95rem; }

.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.panel { order: 1; } .card { order: 2; } .tabela { order: 3; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .card { order: 1; grid-column: 1; grid-row: 1; }
  .panel { order: 2; grid-column: 2; grid-row: 1; }
  .tabela { grid-column: 1 / -1; grid-row: 2; }
}
.surface { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* Painel do caixa */
.panel { padding: 16px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.kpi .k { font-size: .82rem; color: var(--muted); }
.kpi .v { font-family: var(--f-head); font-weight: 800; font-size: 1.6rem; line-height: 1.1; margin-top: 2px; }
.kpi .s { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.status { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: .95rem; margin-bottom: 8px; }
.status.ok { background: var(--pos-bg); color: var(--pos); } .status.no { background: var(--neg-bg); color: var(--neg); }
.chart { width: 100%; height: auto; display: block; }
.chart .zero { stroke: var(--line); stroke-width: 1.5; }
.chart .ghost { fill: none; stroke: var(--ghost); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .bpos { fill: var(--pos); } .chart .bneg { fill: var(--neg); }
.chart .val { font: 700 13px var(--f-body); fill: var(--ink); text-anchor: middle; }
.chart .val.n { fill: var(--neg); }
.chart .mes { font: 600 12.5px var(--f-body); fill: var(--muted); text-anchor: middle; }
.bar { animation: grow .45s ease-out; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 2px; }
.legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.legend .l1 { background: var(--pos); } .legend .l2 { border: 1.5px dashed var(--ghost); }
.avisos { margin-top: 10px; display: grid; gap: 6px; }
.aviso { font-size: .85rem; border-left: 4px solid var(--mix); background: var(--mix-bg); color: var(--ink); padding: 6px 10px; border-radius: 0 8px 8px 0; }
.aviso b { font-weight: 800; }

/* Cartão de perguntas */
.card { padding: 20px 18px; }
.steps { display: flex; gap: 4px; margin-bottom: 14px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.done { background: var(--primary); } .steps span.now { background: var(--primary); outline: 2px solid var(--primary); outline-offset: 2px; }
.card h2 { font-size: clamp(1.25rem, 3.6vw, 1.6rem); font-weight: 800; margin-bottom: 8px; }
.card .lead { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
.card .sit { margin-bottom: 12px; max-width: 62ch; }
.card .q { font-weight: 800; font-size: 1.08rem; margin: 14px 0 10px; }
.evento { border-left: 5px solid var(--neg); background: var(--neg-bg); padding: 10px 14px; border-radius: 0 10px 10px 0; margin-bottom: 12px; }
.evento b { display: block; color: var(--neg); margin-bottom: 2px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--primary); }
.opt[aria-pressed="true"] { border-color: var(--primary); background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); }
.opt .t { font-weight: 600; }
.resultado { margin-top: 14px; border-top: 2px solid var(--line); padding-top: 14px; }
.chip { display: inline-block; font-weight: 800; font-size: .92rem; padding: 4px 12px; border-radius: 999px; margin-bottom: 8px; }
.chip.good { background: var(--pos-bg); color: var(--pos); } .chip.bad { background: var(--neg-bg); color: var(--neg); }
.chip.mixed { background: var(--mix-bg); color: var(--mix); } .chip.neutral { background: var(--neu-bg); color: var(--neu); }
.nums { display: grid; gap: 4px; margin: 4px 0 10px; font-size: .95rem; }
.nums div b { font-weight: 800; }
.premissa { font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
.porque { margin-bottom: 8px; max-width: 62ch; }
.apostila { font-size: .86rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 22px; border-radius: 999px; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 800; }
.btn.sec { background: transparent; color: var(--primary); }
.btn:hover { filter: brightness(1.06); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

.topbar { margin: -6px 0 4px -6px; }
.back { background: none; border: none; color: var(--primary); font-weight: 700; padding: 8px 6px; min-height: 40px; border-radius: 8px; }
.back:hover { text-decoration: underline; }

/* Final */
.final .big { font-size: 1.05rem; margin-bottom: 12px; }
.decs { display: grid; gap: 8px; margin: 12px 0; }
.dec { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.dec .tt { font-weight: 700; } .dec .oo { grid-column: 1; font-size: .9rem; color: var(--muted); }
.dec .dd { font-weight: 800; text-align: right; grid-column: 2; grid-row: 1; }
.dec .gg { grid-column: 2; grid-row: 2; justify-self: end; }
.dec .gg button { background: none; border: none; color: var(--primary); font-weight: 700; padding: 6px 2px; text-decoration: underline; }
.licoes { margin: 10px 0 14px; padding-left: 20px; display: grid; gap: 6px; max-width: 62ch; }

/* Tabela */
.tabela { padding: 14px 14px 10px; }
.tabela h3 { font-size: 1.15rem; margin-bottom: 8px; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--line); }
table.fluxo { border-collapse: collapse; width: 100%; min-width: 660px; font-size: .92rem; }
.fluxo th, .fluxo td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.fluxo thead th { background: var(--primary); color: var(--on-primary); font-weight: 700; text-align: right; }
.fluxo thead th:first-child, .fluxo td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; }
.fluxo td:first-child { background: var(--surface); font-weight: 500; }
.fluxo tr.sec th { background: var(--surface-2); color: var(--ink); text-align: left; font-family: var(--f-head); font-size: .95rem; }
.fluxo td.num { text-align: right; font-variant-numeric: tabular-nums; }
.fluxo td.num.neg { color: var(--neg); font-weight: 700; }
.fluxo tr.tot td { font-weight: 800; background: var(--surface-2); }
.fluxo tr.tot td:first-child { background: var(--surface-2); }
.fluxo tr.fim td { border-top: 2px solid var(--ink); font-weight: 800; }
.fluxo td.chg { background: var(--chg); animation: flash 1.3s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 100px rgba(255,190,0,.55); } to { box-shadow: inset 0 0 0 100px rgba(255,190,0,0); } }
.fluxo td.hl { color: var(--muted); }
.nota { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.nota .sw { display: inline-block; width: 12px; height: 12px; background: var(--chg); border: 1px solid var(--line); vertical-align: -1px; margin-right: 4px; border-radius: 2px; }
.rodape { color: var(--muted); font-size: .8rem; margin-top: 18px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar, .fluxo td.chg { animation: none; } .opt { transition: none; } }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Confecção da Dona Maria</h1>
    <p class="sub">Simulador de fluxo de caixa</p>
  </header>
  <main class="grid">
    <section class="card surface" id="card" aria-label="Situação e perguntas"></section>
    <section class="panel surface" id="painel" aria-label="Painel do caixa"></section>
    <section class="tabela surface" id="tabela" aria-label="Tabela do fluxo de caixa"></section>
  </main>
  <p class="rodape">Simulação didática em reais, com valores arredondados. As premissas de cada opção são hipóteses para discussão em sala.</p>
</div>
<script>
// ===== MOTOR DE CÁLCULO: reproduz a lógica da planilha "Fluxo 1 gabarito" =====
var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril'];

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function baseState() {
  return {
    priceCam: [15, 15, 15, 15],
    priceUni: [5, 5, 5, 5],
    qtyCam: [500, 500, 800, 800],
    qtyUni: [3000, 3000, 500, 500],
    volCam: [1, 1, 1, 1],
    volUni: [1, 1, 1, 1],
    terms: [[1,0,0,0],[1,0,0,0],[1,0,0,0],[1,0,0,0]], // como cada mês de venda é recebido (mês 0, +1, +2, +3)
    recMult: [1, 1, 1, 1],        // multiplicador dos recebimentos (taxas)
    entradaAdj: [0, 0, 0, 0],     // atrasos e descontos de clientes
    outrasEntradas: [0, 0, 0, 0], // empréstimos e aportes
    mp: [5000, 5000, 7000, 7000], // compras de matéria-prima
    mpDefer: false,               // paga a matéria-prima 30 dias depois
    fixed: [10000, 10000, 10000, 10000],
    outrasSaidas: [0, 0, 0, 0],   // retiradas dos sócios e parcelas
    comRate: [0.2, 0.2, 0.2, 0.2], // comissões e impostos por mês
    pedidos: [],                  // pedidos grandes: {m, qtd, preco, terms}
    prevFat: 20000,               // faturamento do mês anterior a janeiro
    saldoIni: 5000,
    receberDepois: 0,             // valores a receber depois de abril (fora do período)
    pagarDepois: 0                // valores a pagar depois de abril (fora do período)
  };
}

function compute(s) {
  var N = 4, i, k, m;
  var qCam = [], qUni = [], fatCam = [], fatUni = [];
  for (m = 0; m < N; m++) {
    qCam[m] = Math.round(s.qtyCam[m] * s.volCam[m]);
    qUni[m] = Math.round(s.qtyUni[m] * s.volUni[m]);
    fatCam[m] = Math.round(qCam[m] * s.priceCam[m]);
    fatUni[m] = Math.round(qUni[m] * s.priceUni[m]);
  }
  var fatCamRec = fatCam.slice(), fatUniRec = fatUni.slice(); // base para os recebimentos normais
  var pedRec = [0,0,0,0], pedDepois = 0;
  s.pedidos.forEach(function (p) {
    qUni[p.m] += p.qtd; fatUni[p.m] += Math.round(p.qtd * p.preco);
    for (var kk = 0; kk < 4; kk++) {
      var tt = p.terms[kk]; if (!tt) continue;
      var vv = Math.round(p.qtd * p.preco * tt);
      if (p.m + kk < 4) pedRec[p.m + kk] += vv; else pedDepois += vv;
    }
  });
  var recCam = [0,0,0,0], recUni = [0,0,0,0], receberDepois = s.receberDepois + pedDepois;
  for (i = 0; i < N; i++) {
    for (k = 0; k < N; k++) {
      var t = s.terms[i][k];
      if (!t) continue;
      var vC = Math.round(fatCamRec[i] * t * s.recMult[i]);
      var vU = Math.round(fatUniRec[i] * t * s.recMult[i]);
      if (i + k < N) { recCam[i + k] += vC; recUni[i + k] += vU; }
      else { receberDepois += vC + vU; }
    }
  }
  for (m = 0; m < N; m++) recUni[m] += pedRec[m];
  var mpPago = [], pagarDepois = s.pagarDepois;
  for (m = 0; m < N; m++) {
    if (s.mpDefer) mpPago[m] = m === 0 ? 0 : s.mp[m - 1];
    else mpPago[m] = s.mp[m];
  }
  if (s.mpDefer) pagarDepois += s.mp[N - 1];

  var meses = [], saldo = s.saldoIni, menor = Infinity, menorMes = 0, negativos = 0, prevFat = s.prevFat;
  for (m = 0; m < N; m++) {
    var fat = fatCam[m] + fatUni[m];
    var totalEnt = recCam[m] + recUni[m] + s.entradaAdj[m] + s.outrasEntradas[m];
    var com = Math.round(s.comRate[m] * prevFat);
    var totalSai = mpPago[m] + com + s.fixed[m] + s.outrasSaidas[m];
    var liquido = totalEnt - totalSai;
    var ini = saldo;
    var fim = ini + liquido;
    meses.push({
      qCam: qCam[m], qUni: qUni[m], fat: fat,
      recCam: recCam[m], recUni: recUni[m], adj: s.entradaAdj[m], outEnt: s.outrasEntradas[m],
      totalEnt: totalEnt,
      mp: mpPago[m], com: com, fixo: s.fixed[m], outSai: s.outrasSaidas[m],
      totalSai: totalSai, liquido: liquido, ini: ini, fim: fim
    });
    if (fim < menor) { menor = fim; menorMes = m; }
    if (fim < 0) negativos++;
    saldo = fim;
    prevFat = fat;
  }
  return {
    meses: meses, saldoAbril: meses[N - 1].fim, menor: menor, menorMes: menorMes,
    negativos: negativos, receberDepois: receberDepois, pagarDepois: pagarDepois
  };
}

// ===== SITUAÇÕES, PERGUNTAS E OPÇÕES =====
// Cada opção muda o "estado" da empresa; o motor recalcula o fluxo de caixa.
function brl(v) {
  var neg = v < 0, a = Math.abs(Math.round(v));
  var s = a.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + 'R$ ' + s;
}
function each(arr, idxs, fn) { idxs.forEach(function (i) { arr[i] = fn(arr[i]); }); }

var ROUNDS = [
  // 1 ---------------------------------------------------------------
  {
    id: 'diagnostico', titulo: 'Diagnóstico', tipo: 'diagnostico',
    situacao: function () {
      return 'Olhe a tabela de fluxo de caixa. O caixa cresce em janeiro e fevereiro, mas despenca em março e fica negativo em abril.';
    },
    pergunta: 'Antes de agir, descubra a causa. O que explica a piora do caixa em março e abril?',
    apostila: 'Primeiro analise as causas dos saldos, depois planeje as estratégias para reverter os problemas.',
    opcoes: [
      { id: 'a', texto: 'Os custos fixos de R$ 10.000 são altos demais.', certa: false,
        porque: 'Eles pesam, mas são iguais todos os meses, então não explicam por que o caixa piora justamente em março. Continuam na lista de ajustes possíveis.' },
      { id: 'b', texto: 'As entradas caem de R$ 22.500 para R$ 14.500 em março, mas as saídas continuam perto de R$ 20 mil.', certa: true,
        porque: 'Essa é a causa principal. As vendas de uniformes despencam (de 3.000 para 500 unidades) e as entradas caem R$ 8.000. As saídas não acompanham: a matéria-prima sobe e a comissão de março ainda é calculada sobre as vendas altas de fevereiro.' },
      { id: 'c', texto: 'A comissão e os impostos de 20% são altos demais.', certa: false,
        porque: '20% é bastante, mas a comissão acompanha as vendas. Ela só pesa em março porque é calculada sobre o mês anterior, quando as vendas ainda eram altas.' },
      { id: 'd', texto: 'O saldo inicial de R$ 5.000 é pequeno demais.', certa: false,
        porque: 'Ele ajuda, mas o problema aparece mesmo com R$ 11.500 em caixa no fim de fevereiro. O que mudou foi o ritmo das entradas, não o ponto de partida.' }
    ]
  },
  // 2 ---------------------------------------------------------------
  {
    id: 'preco', titulo: 'Preço de venda',
    situacao: function () {
      return 'Agora é hora de agir. As entradas estão baixas, e o preço de venda é uma das alavancas mais rápidas: hoje a camiseta custa R$ 15 e o uniforme R$ 5.';
    },
    pergunta: 'O que você faz com os preços?',
    apostila: 'Definir metas de vendas e analisar a capacidade de pagamento a partir das projeções de caixa.',
    opcoes: [
      { id: 'a', texto: 'Subir R$ 1 em cada produto (camiseta a R$ 16 e uniforme a R$ 6).',
        premissa: 'Os clientes aceitam o novo preço e as quantidades vendidas continuam as mesmas.',
        porque: 'Um pequeno reajuste em todos os produtos muda o caixa de todos os meses. Com 3.000 uniformes vendidos, cada R$ 1 a mais vale R$ 3.000 por mês. Na vida real, teste o novo preço aos poucos e acompanhe as vendas.',
        aplicar: function (s) { s.priceCam = [16,16,16,16]; s.priceUni = [6,6,6,6]; } },
      { id: 'b', texto: 'Subir R$ 1 só nas camisetas.',
        premissa: 'Os clientes aceitam o novo preço e as quantidades continuam as mesmas.',
        porque: 'Ajuda, mas só em parte: o reajuste atinge um dos dois produtos. Compare com a opção de reajustar os dois.',
        aplicar: function (s) { s.priceCam = [16,16,16,16]; } },
      { id: 'c', texto: 'Subir R$ 3 nas camisetas e R$ 2 nos uniformes.',
        premissa: 'Os preços ficam 20% e 40% mais altos, e os clientes compram 30% menos.',
        porque: 'Preço alto demais afasta clientes. O que entra com o preço novo não compensa as vendas perdidas.',
        aplicar: function (s) {
          s.priceCam = [18,18,18,18]; s.priceUni = [7,7,7,7];
          s.volCam = s.volCam.map(function (v) { return v * 0.7; });
          s.volUni = s.volUni.map(function (v) { return v * 0.7; });
        } },

function escolher(round, opId, estado) {
  var s = clone(estado);
  var op = round.opcoes.filter(function (o) { return o.id === opId; })[0];
  if (op && op.aplicar) op.aplicar(s);
  return s;
}

        '<div class="oo">' + esc(o.texto) + '</div><div class="gg"><button data-act="goto" data-v="' + i + '">Refazer esta decisão</button></div></div>';
    });
    var h = '<div class="topbar"><button class="back" data-act="back">‹ Voltar</button></div><h2 tabindex="-1" id="foco">Resultado final</h2>';
    h += neg.length === 0
      ? '<p class="big"><b class="pos">Parabéns! O caixa fechou os quatro meses no azul.</b> Abril passou de ' + brl(BASEC.saldoAbril) + ' para ' + brl(fc.saldoAbril) + ', e o menor saldo do período foi ' + brl(fc.menor) + ' (' + mesLow(fc.menorMes) + ').</p>'
      : '<p class="big"><b class="neg">Ainda há meses no vermelho: ' + neg.join(', ') + '.</b> O menor saldo foi ' + brl(fc.menor) + ' (' + mesLow(fc.menorMes) + '). Veja quais decisões pesaram contra e refaça algumas delas.</p>';
    h += '<p class="lead">Efeito de cada decisão no saldo final de abril (no momento em que foi tomada):</p><div class="decs">' + decs + '</div>';
    if (best && best.d > 0) h += '<p class="sit">Decisão que mais ajudou: <b>' + esc(best.t) + '</b>.</p>';
    if (worst && worst.d < 0) h += '<p class="sit">Decisão que mais pesou contra: <b>' + esc(worst.t) + '</b>.</p>';
    h += '<p class="q">O que levar desta simulação</p><ul class="licoes">' +
      '<li>Analise as causas do saldo antes de agir: a falta de dinheiro é a febre, não a doença.</li>' +
      '<li>Vender mais não é o mesmo que ter mais caixa. O que importa é quando o dinheiro entra e quando a conta vence.</li>' +
      '<li>Olhe o menor saldo do período, não só o saldo final. Um mês no vermelho no meio do caminho já é problema.</li>' +
      '<li>Prazo e financiamento empurram o problema para frente: confira os avisos de "depois de abril".</li>' +
      '<li>Tenha uma reserva para imprevistos: um conserto, um atraso ou uma alta de custo pode abrir um buraco no caixa.</li></ul>' +
      '<div class="btnrow"><button class="btn" data-act="restart">Recomeçar a simulação</button></div>';
    return h;
  }

  // ---------- desenho ----------
  function render(focusSel) {
    var cur = compute(display()), ref = compute(reference()), s = display();
    document.getElementById('painel').innerHTML = renderPanel(cur);
    document.getElementById('tabela').innerHTML = renderTable(cur, ref, s);
    document.getElementById('card').innerHTML = app.screen === 'intro' ? introHTML() : app.screen === 'final' ? '<div class="final">' + finalHTML() + '</div>' : roundHTML();
    if (focusSel) { var el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  }
  function toTop() {
    var f = document.getElementById('foco'), c = document.getElementById('card');
    if (c) c.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (f) f.focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'start') { app.screen = 'round'; render(); toTop(); }
    else if (act === 'choose') {
      app.chosen = v; render('.opt[data-v="' + v + '"]');
      var res = document.getElementById('res');
      if (res && res.firstChild) res.firstChild.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    }
    else if (act === 'next') {
      app.picks[app.i] = app.chosen;
      var ns = afterChoice(app.i, app.chosen);
      if (app.i + 1 < ROUNDS.length) { enterRound(app.i + 1, ns); }
      else { app.finalState = ns; app.screen = 'final'; }
      render(); toTop();
    }
    else if (act === 'back') {
      var kb;
      if (app.screen === 'final') { kb = ROUNDS.length - 1; app.chosen = app.picks[kb]; app.picks.length = kb; app.i = kb; app.finalState = null; app.screen = 'round'; }
      else if (app.i === 0) { app.chosen = null; app.screen = 'intro'; }
      else { kb = app.i - 1; app.chosen = app.picks[kb]; app.picks.length = kb; app.i = kb; }
      render(); toTop();
    }
    else if (act === 'goto') { var k = parseInt(v, 10); app.picks.length = k; app.i = k; app.chosen = null; app.screen = 'round'; render(); toTop(); }
    else if (act === 'restart') { resetAll(); render(); toTop(); }
  });

  resetAll(); render();
})();

</script>
</body>
</html>
